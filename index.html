<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 DRILL 1</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
     <style>
         * { box-sizing: border-box;
        }
         
         body {
            margin: 0;
            min-height: 100vh;
            background-color: #2c0606;
            color: #202020;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            position: relative;
            min-height: 100vh;
            padding: 48px 7% 80px;
        
        }

        header {
            max-width: 1500px;
            margin: 0 auto;
            padding: 12px 20px;
            background-color: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 5px 7px 9px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            margin: 0;
            font-size: clamp(24px, 3vw, 42px);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 4fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .guide-card {
            min-height: 235px;
            padding: 22px;
            background-color: white;
            border: 1px solid #dddddd;
            border-radius: 9px;
            box-shadow: 5px 7px 8px rgba(187, 184, 184, 0.45);
        }

        .guide-card h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
            padding: 8px 10px;
            background-color: #7a6a6a;
            border-radius: 7px;
            font-size: 21px;
            font-weight: 500;
        }

        .guide-card ul {
            margin: 0;
            padding-left: 32px;
            font-size: 18px;
            line-height: 1.8;
        }

        @media (max-width: 800px) {
            .page{
                padding: 25px 6% 50px;
            }
        
            .cards {
                grid-template-columns: 2fr;
                max-width: 500px;
                gap: 22px;
            }

            .guide-card {
                min-height: 210px;
            }

        }
    <body>
         <main class="page">

   
    <header>
        <h1>🏸Beginners Guide for Badminton</h1>
  </header>
    
        <div class="container">

        <br>

        <section class="cards" label="Badminton beginner guide">

            <div class="guide-card">
                <h2><span class="true"></span>Rules</h2>

                 <br>
                <ul>
                    <li>Serve diagonally</li>
                    <li>No touching the net</li>
                    <li>Clean hit</li>
                    <li>Scoring system</li>
                </ul>

                </div>

             <br><br>
            <div class="guide-card">
                <h2>
                    <span class="true"></span>
                    Equipment
                </h2>

                <ul>
                    <li>Racket</li>
                    <li>Shuttlecock</li>
                    <li>Net</li>
                    <li>Shoes for badminton</li>
                </ul>
            </div>
       
        <br><br> 
        <div class="guide-card">
                <h2>
                    <span class="true"></span>
                    GOATED Techniques
                </h2>

                <ul>
                    <li>Forehand and backhand hits</li>
                    <li>Grips</li>
                    <li>Footwork</li>
                    <li>Positioning</li>
                </ul>
            </div>

        </section>
                </main>
            </div>
        </div>
    </div>
</body>
</html>
